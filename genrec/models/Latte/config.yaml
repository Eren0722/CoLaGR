# Latte (Latent Token) Model Configuration
# Latte extends PSID by adding latent tokens before semantic IDs.
# During prediction, the model first predicts a latent token, then the semantic IDs.
# Multiple predictions mapping to the same item are aggregated using agg_sum or agg_max.

# Overwritting configs
metadata: sentence    # Overwrite data config file, Latte only supports 'sentence'
lr: 0.003             # Overwrite learning rate
weight_decay: 0.05    # Overwrite weight decay

# Config for sentence embedding model
#   Sentence T5
sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_dim: 768
sent_emb_pca: 192
#   OpenAI Embedding Model
# sent_emb_model: text-embedding-3-large
# sent_emb_dim: 3072
# sent_emb_pca: 768
# openai_api_key: ~
sent_emb_batch_size: 512

# Config for VQ (Vector Quantization)
# Latte supports loading semantic IDs generated by PSID with various vq_methods
# Supported methods: rqkmeans (default), rqvae, opq
# Note: Latte only generates semantic IDs with rqkmeans; for other methods,
#       it loads pre-generated semantic IDs from PSID
vq_method: rqkmeans
faiss_omp_num_threads: 32
vq_n_codebooks: 3
vq_codebook_size: 256

# Config for Latte-specific settings
n_latent_tokens: 8              # Number of latent tokens
aggregation_method: "agg_max"   # Method to aggregate scores: 'agg_sum' or 'agg_max'

# Config for Latte model
n_user_tokens: 1      # Number of user tokens hashed from user ids
max_item_seq_len: 20  # Maximum #items in a sequence
num_beams: 50         # Number of beams for beam search

# Config for T5
num_layers: 4
num_decoder_layers: 4
d_model: 128
d_ff: 1024
num_heads: 6
d_kv: 64
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"