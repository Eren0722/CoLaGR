# CoLaGR configuration.
# Mainline keeps two validated paths: CoPref training supervision and CoLeaf
# inference calibration.

metadata: sentence
lr: 0.003
weight_decay: 0.05

sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_dim: 768
sent_emb_pca: 192
sent_emb_batch_size: 512

vq_method: rqkmeans
faiss_omp_num_threads: 32
vq_n_codebooks: 3
vq_codebook_size: 256
vq_permutation: 0

rqvae_hidden_sizes: [2048,1024,512,256,128]
rqvae_dropout: 0.0
rqvae_lr: 0.001
rqvae_batch_size: 2048
rqvae_epoch: 10000
rqvae_beta: 0.25
rqvae_verbose: 500
rqvae_low_usage_threshold: -1

n_user_tokens: 1
max_item_seq_len: 20
num_beams: 50

num_layers: 4
num_decoder_layers: 4
d_model: 128
d_ff: 1024
num_heads: 6
d_kv: 64
dropout_rate: 0.1
activation_function: "relu"
feed_forward_proj: "relu"

# CoPref
level_token_ids_path: null
copref_train_path: null
copref_val_path: null
copref_test_path: null
load_eval_copref_diagnostics: false
# Tensor-format CoPref is loaded once per process. This avoids a CPU lookup and
# host-to-device copy for every batch; disable only for low-memory diagnostics.
preload_copref_to_device: true
lambda_c: 2.5
lambda_pref: 2.5
copref_level_weights: [1.0, 1.0, 1.0]

# Main ablation switches.
use_copref_module: true
use_copref_loss: true
grounding_anchor: cp
# Each SID level has its own collaborative preference state.
copref_reasoning_mode: per_level
direct_copref_alignment: false

init_checkpoint_path: null
eval_only: false

# Shared input pipeline configuration.
dataloader_num_workers: 4

scheduler_total_steps: null

# Generation
use_prefix_trie: true
valid_prefix_trie_path: null
